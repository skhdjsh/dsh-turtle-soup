- insert:
    - id: turtle-soup
      name: 'dsh-turtle-soup'
      config:
        # 自建后端（server/）的地址；留空就只能在调用时传 serverUrl
        serverUrl: ''
        # 后端令牌建议放 ~/.dsh/turtle-soup/tokens.json，而不是这里（本文件随仓库公开）
        submitToken: ''
        adminToken: ''
        # 投稿箱：issue 所属仓库（owner/repo）
        githubRepo: 'skhdjsh/dsh-turtle-soup'
        giteeRepo: 'ni-xiaotu/turtle-submissions'
        # 只拉带这个标签的 issue
        issueLabel: 'turtle-submission'
        # 本地 HTTP 桥：给 AstrBot 的 QQ 大肥鱼调用（只监听 127.0.0.1）
        # 令牌从 ~/.dsh/turtle-soup/tokens.json 的 bridgeToken 读
        bridgeEnabled: true
        bridgePort: 8799
